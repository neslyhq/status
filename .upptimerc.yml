# nesly status page (Upptime). Deliberately OUTSIDE the platform's own
# infrastructure: GitHub Actions probe the endpoints and GitHub Pages
# serves the page, so it stays reachable when the platform is not.
owner: neslyhq
repo: status

sites:
  - name: nesly.net
    url: https://nesly.net
  - name: Console
    url: https://console.nesly.net
  - name: API
    url: https://api.nesly.net/healthz
  - name: Docs
    url: https://nesly.net/docs/

status-website:
  css: |
    :root{--body-background-color:#f5f6f8;--body-text-color:#111827;--card-background-color:#ffffff;--card-border-color:#e5e7eb;--nav-background-color:#ffffff;--nav-border-bottom-color:#e5e7eb;--nav-current-border-bottom-color:#111827;--up-border-left-color:#e5e7eb;--degraded-border-left-color:#d97706;--down-border-left-color:#dc2626;--down-background-color:#ffffff;--tag-color:#111827;--tag-up-background-color:transparent;--tag-down-background-color:transparent;--tag-degraded-background-color:transparent;--change-background-color:transparent;--error-button-border-color:#111827;--error-button-background-color:#111827;--error-button-color:#ffffff;--submit-button-border-color:#111827;--submit-button-background-color:#111827;--submit-button-color:#ffffff}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827}
    h1{font-size:28px!important;font-weight:600;letter-spacing:-.01em;line-height:1.25}
    h2{font-size:20px;font-weight:600}
    h3{opacity:1;color:#6b7280;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
    h4{font-weight:600;margin-bottom:.35em}
    p.lead{color:#6b7280;font-size:15px}
    nav{font-weight:500;font-size:15px}
    nav a{padding:1rem 1.25rem}
    article{border-radius:14px;border:1px solid #e5e7eb;padding:1rem 1.25rem;overflow:hidden}
    article.up{border-left-width:1px!important}
    article.down,article.degraded{border-left-width:3px!important}
    article+article{margin-top:.75rem}
    article.graph{background-image:none!important}
    article.graph::after{content:"";position:absolute;inset:0;background-image:var(--background);background-size:contain;background-repeat:no-repeat;background-position:center right;filter:grayscale(1);opacity:.22;pointer-events:none}
    article.graph>*{position:relative;z-index:1}
    .tag{border:1px solid currentColor;font-weight:600;border-radius:8px;padding:.2rem .5rem;background:transparent!important}
    .tag.up,.tag.closed{color:#16a34a}.tag.down,.tag.open{color:#dc2626}.tag.degraded{color:#d97706}
    .data{font-weight:500}
    .r label{color:#6b7280}.r input:checked+label{color:#111827}
    footer{color:#6b7280;font-size:13px;opacity:1}footer a{color:#6b7280}
  # No custom domain yet: served at neslyhq.github.io/status. When the
  # Cloudflare token arrives, add `cname: status.nesly.net` and drop baseUrl.
  cname: status.nesly.net
  baseUrl: /
  name: nesly status
  introTitle: "Live status of **nesly**"
  introMessage: Uptime and response times, measured every 5 minutes from outside our own infrastructure.
  navbar:
    - title: Status
      href: /
    - title: nesly.net
      href: https://nesly.net
i18n:
  allSystemsOperational: All systems operational
  degradedPerformance: Some services are slower than usual
  completeOutage: Services are down
  partialOutage: Some services are down
  liveStatus: Live status
  overallUptime: "Uptime: $UPTIME"
  averageResponseTime: "Response time: $TIME"
