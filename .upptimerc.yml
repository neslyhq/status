# nesly status page (Upptime). Deliberately OUTSIDE the platform's own
# infrastructure: GitHub Actions probe the endpoints and GitHub Pages
# serves the page, so it stays reachable when the platform is not.
owner: neslyhq
repo: status

sites:
  - name: nesly.net
    url: https://nesly.net
  - name: Console
    url: https://console.nesly.net
  - name: API
    url: https://api.nesly.net/healthz
  - name: Docs
    url: https://nesly.net/docs/

status-website:
  # No custom domain yet: served at neslyhq.github.io/status. When the
  # Cloudflare token arrives, add `cname: status.nesly.net` and drop baseUrl.
  baseUrl: /status
  name: nesly status
  introTitle: "Live status of **nesly**"
  introMessage: Uptime and response times, measured every 5 minutes from outside our own infrastructure.
  navbar:
    - title: Status
      href: /
    - title: nesly.net
      href: https://nesly.net
